<!DOCTYPE html>
<!-- Projeto criado por MARCELO CLEITON. Análise do impacto da Reforma Tributária nas aplicações da SN SISTEMA. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Venda B2B — Telemarketing · Marcelo Cleiton</title>
<meta name="author" content="Marcelo Cleiton">
<meta name="description" content="Projeto criado por Marcelo Cleiton para analisar o impacto da Reforma Tributária nas aplicações da SN SISTEMA.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;
--bg:#fff;--layer:#f4f4f4;--layer2:#e0e0e0;--ink:#161616;--ink2:#525252;--line:#e0e0e0;--pri:#0f62fe;--priSoft:#d0e2ff;--onPri:#fff;--pos:#198038;--err:#da1e28;--warnLn:#f1c21b;--d4:#9f1853}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161616;--layer:#262626;--layer2:#393939;--ink:#f4f4f4;--ink2:#c6c6c6;--line:#393939;--pri:#78a9ff;--priSoft:#001d6c;--onPri:#161616;--pos:#42be65;--err:#fa4d56;--warnLn:#8e6a00;--d4:#ff7eb6}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161616;--layer:#262626;--layer2:#393939;--ink:#f4f4f4;--ink2:#c6c6c6;--line:#393939;--pri:#78a9ff;--priSoft:#001d6c;--onPri:#161616;--pos:#42be65;--err:#fa4d56;--warnLn:#8e6a00;--d4:#ff7eb6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--layer2);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;overflow-x:clip}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.app{background:var(--bg);min-height:100vh;margin:0 auto}
.card{background:var(--layer);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.ct{font-size:15px;font-weight:600;margin:0 0 10px}.sub{font-size:12px;color:var(--ink2)}.lbl{font-size:13px;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inp{background:var(--bg);color:var(--ink);border:0;border-bottom:1px solid var(--ink2);padding:8px;font:inherit;font-size:16px;width:100px;text-align:right}
.inp:focus,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--pri)}
.chip{border:1px solid var(--ink2);background:transparent;color:var(--ink);border-radius:18px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onPri)}
.btn{background:var(--pri);color:var(--onPri);border:0;padding:12px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.btn2{background:var(--layer2);color:var(--ink);border:0;padding:10px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:40px}
.step{width:40px;height:40px;border:1px solid var(--ink2);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
.qty{width:56px;height:40px;text-align:center;border:1px solid var(--ink2);border-left:0;border-right:0;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--layer2)}
.seg button{border:0;background:transparent;color:var(--ink2);padding:12px 4px;font:inherit;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600;border-bottom-color:var(--pri)}
.bar{display:flex;height:34px;overflow:hidden;background:var(--layer2)}
table{border-collapse:collapse;width:100%;font-size:13px}td{padding:7px 4px;border-bottom:1px solid var(--line)}td.r{text-align:right}tr.tot td{font-weight:700;border-top:2px solid var(--ink)}tr.hl td{font-weight:600;background:var(--priSoft)}
.posc{color:var(--pos)}.neg{color:var(--err)}
.calc{background:var(--bg);border-left:3px solid var(--pri);padding:6px 8px;margin-top:6px;font-size:11px;white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.dock{position:fixed;left:0;right:0;bottom:0;background:#161616;color:#f4f4f4;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20}
.dock .btn{background:#0f62fe;color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useMemo,useEffect}=React;const html=htm.bind(React.createElement);
const brl=n=>(isFinite(n)?n:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pc=(n,d=1)=>(isFinite(n)?n:0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const r2=n=>Math.round(n*100)/100;
const DEFQ=[[1,0],[10,3],[20,5],[50,8]];
const tabOf=x=>{const a=.18,f=1+a/(1-a)+.112+.001,p=(x.c*(1+x.m/100)+x.f)*f;let v=Math.floor(p)+.9;if(v<p)v+=1;return r2(v)};
const CAT0=[['Pão Francês Congelado','cx 5kg',50,10,20],['Pão de Queijo Congelado','cx 10kg',118,14,25],['Massa Folhada Pré-assada','cx 4kg',72,12,22],['Pão de Forma Tradicional','cx 12un',38,6,18],['Bolo Congelado Fatiado','cx 3kg',64,9,28]].map(([n,u,c,f,m])=>({n,u,c,f,t:tabOf({c,f,m}),q:DEFQ}));
const RT0={icms:18,cbs:11.2,ibs:0.1,is:0},LIM0=[0,10];
const CLI=[['Padaria',100],['Supermercado',100],['Mercadinho (Simples)',0]];
// Regra de desconto por quantidade: pega a última faixa cujo "de" é menor ou igual à quantidade e limita ao intervalo permitido
const tierOf=(x,q,lim)=>{const cl=v=>Math.min(lim[1],Math.max(lim[0],v));const fx=(x.q&&x.q.length?x.q:DEFQ).slice().sort((a,b)=>a[0]-b[0]);
 if(q<fx[0][0])return {pct:0,de:1,ate:fx[0][0]-1,next:{de:fx[0][0],pct:cl(fx[0][1])}};
 let k=0;fx.forEach((t,j)=>{if(q>=t[0])k=j});const nx=fx[k+1];
 return {pct:cl(fx[k][1]),de:fx[k][0],ate:nx?nx[0]-1:null,next:nx?{de:nx[0],pct:cl(nx[1])}:null}};
function useWidth(){const [w,setW]=useState(innerWidth);useEffect(()=>{const f=()=>setW(innerWidth);addEventListener('resize',f);return()=>removeEventListener('resize',f)},[]);return w}

function App(){
 const [catalog,setCatalog]=useState(CAT0),[lim,setLim]=useState(LIM0),[origem,setOrigem]=useState('Tabela padrão de exemplo');
 const [lines,setLines]=useState([{id:CAT0[0].n,q:20,p:null},{id:CAT0[1].n,q:10,p:null}]);
 const [desc,setDesc]=useState(0),[prazo,setPrazo]=useState(28);
 const [cli,setCli]=useState('Padaria'),[cred,setCred]=useState(100),[mk,setMk]=useState(35),[mmin,setMmin]=useState(10);
 const [rt,setRt]=useState(RT0),[adv,setAdv]=useState(false),[det,setDet]=useState(true);
 const [imp,setImp]=useState(false),[code,setCode]=useState(''),[impMsg,setImpMsg]=useState('');
 const [tab,setTab]=useState('ped'),[force,setForce]=useState(false),[msg,setMsg]=useState(''),[theme,setTheme]=useState(null);
 const w=useWidth();const mobile=force||w<900;

 const cat=id=>catalog.find(c=>c.n===id)||{n:id,u:'',c:0,f:0,t:0,q:DEFQ};
 const setL=(id,k,v)=>setLines(ls=>ls.map(l=>l.id===id?{...l,[k]:v}:l));
 const add=x=>setLines(ls=>[...ls,{id:x.n,q:1,p:null}]);
 const rm=id=>setLines(ls=>ls.filter(l=>l.id!==id));
 const doImport=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!o.i||!o.i.length)throw 0;
  setCatalog(o.i);setLim(o.l||LIM0);setRt({icms:o.r.icms,cbs:o.r.cbs,ibs:o.r.ibs,is:o.r.is||0});setLines(o.i.slice(0,2).map(x=>({id:x.n,q:10,p:null})));setDesc(0);
  setOrigem('Tabela importada ('+o.i.length+(o.i.length===1?' item)':' itens)'));setImpMsg('Tabela importada com sucesso.')}catch(e){setImpMsg('Código inválido. Copie o código novamente no simulador de preço.')}};
 const reset=()=>{setCatalog(CAT0);setLim(LIM0);setRt(RT0);setLines([{id:CAT0[0].n,q:20,p:null},{id:CAT0[1].n,q:10,p:null}]);setOrigem('Tabela padrão de exemplo');setImpMsg('')};

 const r=useMemo(()=>{
  const a=rt.icms/100,c=rt.cbs/100,i=rt.ibs/100,s=(rt.is||0)/100,ia=a/(1-a),f=1+ia+c+i+s;
  const rows=lines.map(l=>{const x=cat(l.id),ti=tierOf(x,l.q,lim),auto=r2(x.t*(1-ti.pct/100)),eff=l.p!=null?l.p:auto;return {l,x,ti,auto,eff}});
  const un=rows.reduce((t,o)=>t+o.l.q,0),tabT=rows.reduce((t,o)=>t+o.l.q*o.x.t,0),dQ=rows.reduce((t,o)=>t+o.l.q*(o.x.t-o.auto),0),dN=rows.reduce((t,o)=>t+o.l.q*(o.auto-o.eff),0),bruto=rows.reduce((t,o)=>t+o.l.q*o.eff,0);
  const cpvT=rows.reduce((t,o)=>t+o.l.q*o.x.c,0),freT=rows.reduce((t,o)=>t+o.l.q*o.x.f,0);
  const total=Math.max(0,bruto-desc),base=total/f,icms=base/(1-a)*a,cbs=base*c,ibs=base*i,is=base*s;
  const cr=(icms+cbs+ibs)*cred/100,split=cbs+ibs+is,lucro=base-cpvT-freT,minL=cpvT*mmin/100,folga=lucro-minL;
  return {rows,a,c,i,s,ia,f,un,tabT,dQ,dN,bruto,cpvT,freT,total,base,icms,cbs,ibs,is,cr,custo:total-cr,split,liq:total-split,lucro,lp:cpvT?lucro/cpvT*100:0,minL,folga,maxDesc:Math.max(0,desc+folga*f)};
 },[lines,desc,cred,mmin,rt,catalog,lim]);

 const Dl=(ls)=>det&&html`<div class="calc mono">${ls.map((l,k)=>html`<div key=${k}>${l}</div>`)}</div>`;
 const fS=r.f.toFixed(4);
 const venc=new Date(Date.now()+prazo*864e5).toLocaleDateString('pt-BR');
 const revenda=r.custo*(1+mk/100);
 const st=r.lucro<=0?['bad','Abaixo do custo']:r.folga<0?['warn','Abaixo da margem mínima']:['ok','Dentro da alçada'];
 const stc={bad:'var(--err)',warn:'var(--warnLn)',ok:'var(--pos)'}[st[0]];
 const txt=['PEDIDO B2B','Cliente: '+cli,...r.rows.map(o=>o.l.q+' x '+o.l.id+' ('+o.x.u+') a '+brl(o.eff)+' cada'+(o.ti.pct>0&&o.l.p==null?' (desconto por quantidade de '+pc(o.ti.pct,0)+')':'')),'Desconto na nota: '+brl(desc),'Total do boleto (impostos e frete CIF inclusos): '+brl(r.total),'Vencimento: '+venc+' ('+prazo+' dias)'].join('\n');
 const copy=async()=>{try{await navigator.clipboard.writeText(txt);setMsg('Resumo copiado.')}catch(e){setMsg('Não foi possível copiar. Selecione o texto na caixa.')}};
 const flip=()=>{const d=(theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark'?'light':'dark';setTheme(d);document.documentElement.setAttribute('data-theme',d)};
 const free=catalog.filter(c=>!lines.find(l=>l.id===c.n));

 const Pedido=html`<div>
  <div class="card"><div class="row"><div><div class="lbl">Tabela de preços</div><div class="sub">${origem}. Preços já com impostos e frete CIF. Desconto por quantidade entre ${pc(lim[0],0)} e ${pc(lim[1],0)}.</div></div><button class="btn2" onClick=${()=>setImp(!imp)}>${imp?'Fechar':'Importar'}</button></div>
   ${imp&&html`<div style=${{marginTop:10}}><p class="sub" style=${{marginTop:0}}>No simulador de preço, tabele os produtos, copie o código e cole abaixo.</p>
    <textarea rows="3" value=${code} onInput=${e=>setCode(e.target.value)} placeholder="Cole o código da tabela" class="mono" style=${{width:'100%',background:'var(--bg)',color:'var(--ink)',border:'1px solid var(--line)',padding:8,fontSize:12}}></textarea>
    <div style=${{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginTop:8}}><button class="btn" onClick=${doImport}>Importar tabela</button><button class="btn2" onClick=${reset}>Voltar à tabela padrão</button><span class="sub">${impMsg}</span></div></div>`}</div>
  <div class="card"><h2 class="ct">Itens do pedido</h2>
   ${lines.length===0&&html`<p class="sub">Nenhum item. Adicione um produto abaixo.</p>`}
   ${r.rows.map(({l,x,ti,auto,eff})=>html`<div key=${l.id} style=${{borderBottom:'1px solid var(--line)',paddingBottom:12,marginBottom:12}}>
    <div class="row"><div><div class="lbl">${l.id}</div><div class="sub">${x.u} · tabela ${brl(x.t)}</div></div><button class="btn2" aria-label=${'Remover '+l.id} onClick=${()=>rm(l.id)}>Remover</button></div>
    <div class="row" style=${{marginTop:8}}>
     <div style=${{display:'flex'}}><button class="step" aria-label="Diminuir" onClick=${()=>setL(l.id,'q',Math.max(1,l.q-1))}>−</button><input class="qty mono" type="number" inputmode="numeric" min="1" value=${l.q} onInput=${e=>setL(l.id,'q',Math.max(1,parseInt(e.target.value)||1))} aria-label=${'Quantidade de '+l.id}/><button class="step" aria-label="Aumentar" onClick=${()=>setL(l.id,'q',l.q+1)}>+</button></div>
     <div style=${{textAlign:'right'}}><div class="sub">Preço por caixa, tudo incluso</div><input class="inp mono" type="number" inputmode="decimal" step="0.01" value=${eff} onInput=${e=>setL(l.id,'p',parseFloat(e.target.value)||0)} aria-label=${'Preço de '+l.id}/></div></div>
    <div class="sub" style=${{marginTop:6}}>Desconto por quantidade: <b>${pc(ti.pct,1)}</b> (faixa ${ti.de}${ti.ate==null?'+':'–'+ti.ate} cx)${ti.next?'. Faltam '+(ti.next.de-l.q)+' cx para '+pc(ti.next.pct,1)+'.':'. Maior faixa atingida.'}</div>
    ${l.p!=null&&html`<div class="sub" style=${{marginTop:4}}>Preço negociado manualmente. <button class="btn2" style=${{minHeight:28,padding:'2px 8px'}} onClick=${()=>setL(l.id,'p',null)}>Voltar ao preço da faixa</button></div>`}
    <div class="row sub" style=${{marginTop:6}}><span>${eff<x.t?'Abaixo da tabela em '+brl(x.t-eff)+' por caixa':'Preço de tabela'}</span><b class="mono" style=${{color:'var(--ink)',fontSize:14}}>${brl(l.q*eff)}</b></div>
    ${Dl(['Preço da faixa = tabela × (1 − desconto) = '+brl(x.t)+' × (1 − '+pc(ti.pct,1)+') = '+brl(auto),l.p!=null?'Preço manual substitui a faixa: '+brl(eff):'Preço praticado = preço da faixa = '+brl(eff),'Subtotal = quantidade × preço = '+l.q+' × '+brl(eff)+' = '+brl(l.q*eff)])}</div>`)}
   ${free.length>0&&html`<div class="sub" style=${{marginBottom:6}}>Adicionar produto:</div><div style=${{display:'flex',flexWrap:'wrap',gap:8}}>${free.map(c=>html`<button key=${c.n} class="chip" onClick=${()=>add(c)}>+ ${c.n}</button>`)}</div>`}
  </div>
  <div class="card"><h2 class="ct">Condições comerciais</h2>
   <div class="row"><label class="lbl">Desconto na nota (R$, impostos incl.)</label><input class="inp mono" type="number" inputmode="decimal" step="0.5" min="0" value=${desc} onInput=${e=>setDesc(Math.max(0,parseFloat(e.target.value)||0))}/></div>
   <div style=${{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}>${[0,2,3,5].map(p=>html`<button key=${p} class=${'chip '+(Math.abs(desc-r2(r.bruto*p/100))<0.01?'on':'')} onClick=${()=>setDesc(r2(r.bruto*p/100))}>${p===0?'Sem desconto':p+'% do pedido'}</button>`)}</div>
   ${Dl(['Atalho de % = pedido após descontos por quantidade × % = '+brl(r.bruto)+' × percentual'])}
   <div class="lbl" style=${{marginTop:14}}>Prazo do boleto</div>
   <div style=${{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}}>${[7,14,21,28,35].map(d=>html`<button key=${d} class=${'chip '+(prazo===d?'on':'')} onClick=${()=>setPrazo(d)}>${d} dias</button>`)}</div>
   ${Dl(['Vencimento = data de hoje + prazo = '+new Date().toLocaleDateString('pt-BR')+' + '+prazo+' dias = '+venc])}
   <label class="lbl" style=${{display:'flex',gap:8,alignItems:'center',marginTop:14}}><input type="checkbox" checked=${adv} onChange=${e=>setAdv(e.target.checked)}/> Ajustar alíquotas</label>
   ${adv&&html`<div style=${{marginTop:8}}>${[['icms','ICMS (por dentro)'],['cbs','CBS (dedução)'],['ibs','IBS (dedução)']].map(([k,t])=>html`<div key=${k} class="row" style=${{marginBottom:6}}><span class="lbl">${t}</span><input class="inp mono" type="number" inputmode="decimal" step="0.1" value=${rt[k]} onInput=${e=>setRt({...rt,[k]:parseFloat(e.target.value)||0})}/></div>`)}</div>`}
  </div></div>`;

 const Fechamento=html`<div>
  <div class="card" style=${{background:'var(--bg)',borderTop:'3px solid var(--pri)'}}>
   <div class="sub">Valor a informar ao cliente (impostos e frete CIF inclusos)</div>
   <div class="mono" style=${{fontSize:'clamp(2rem,9vw,2.8rem)',fontWeight:600}}>${brl(r.total)}</div>
   <div class="sub">${r.un} caixas · vencimento ${venc}${r.tabT-r.total>0.005?' · '+brl(r.tabT-r.total)+' de desconto sobre a tabela':''}</div>
   <div class="bar" style=${{marginTop:12}} role="img" aria-label="Composição do pedido">
    <div style=${{width:(r.total?(r.cpvT+r.freT)/r.total*100:0)+'%',background:'var(--ink2)'}}></div>
    <div style=${{width:(r.total?Math.max(0,r.lucro)/r.total*100:0)+'%',background:'var(--pri)'}}></div>
    <div style=${{width:(r.total?(r.total-r.base)/r.total*100:0)+'%',background:'var(--d4)'}}></div></div>
   <div class="sub" style=${{marginTop:4}}>Custo e frete · lucro · impostos</div>
   ${Dl(['Total = Σ (quantidade × preço praticado) − desconto na nota = '+brl(r.bruto)+' − '+brl(desc)+' = '+brl(r.total),'Impostos = total − preço da operação = '+brl(r.total)+' − '+brl(r.base)+' = '+brl(r.total-r.base)])}
  </div>
  <div class="card" style=${{borderLeft:'4px solid '+stc}}>
   <div class="row"><b>Alçada de desconto (interno)</b><b style=${{color:stc}}>${st[1]}</b></div>
   <div class="row" style=${{marginTop:6}}><span class="sub">Lucro do pedido</span><b class=${'mono '+(r.lucro>0?'posc':'neg')}>${brl(r.lucro)} (${pc(r.lp)} do custo)</b></div>
   <div class="row"><span class="sub">Desconto máximo mantendo a margem mínima</span><b class="mono">${brl(r.maxDesc)}</b></div>
   <div class="lbl" style=${{marginTop:10}}>Margem mínima aceita: ${pc(mmin,0)} sobre o custo</div>
   <input type="range" min="0" max="40" step="1" value=${mmin} onInput=${e=>setMmin(+e.target.value)} aria-label="Margem mínima"/>
   ${Dl(['Lucro = preço da operação − custo − frete = '+brl(r.base)+' − '+brl(r.cpvT)+' − '+brl(r.freT)+' = '+brl(r.lucro),'Margem = lucro ÷ custo = '+brl(r.lucro)+' ÷ '+brl(r.cpvT)+' = '+pc(r.lp,2),'Lucro mínimo = custo × margem mínima = '+brl(r.cpvT)+' × '+pc(mmin,0)+' = '+brl(r.minL),'Folga = lucro − lucro mínimo = '+brl(r.lucro)+' − '+brl(r.minL)+' = '+brl(r.folga),'Desconto máximo = desconto atual + folga × f = '+brl(desc)+' + '+brl(r.folga)+' × '+fS+' = '+brl(r.maxDesc)])}
  </div>
  <div style=${{background:'#fbf8f0',color:'#161616',border:'2px dashed #6f6f6f',padding:14,fontSize:13,marginBottom:12}}>
   <div class="row" style=${{borderBottom:'1px solid #8d8d8d',paddingBottom:6}}><b>Boleto bancário B2B</b><span class="mono" style=${{fontSize:11}}>Venc. ${venc}</span></div>
   <div class="row" style=${{padding:'8px 0'}}><span>Pagador: ${cli}</span><span>Frete CIF incluso</span></div>
   <div class="row" style=${{borderTop:'1px solid #8d8d8d',paddingTop:6}}><span style=${{fontSize:11,color:'#6f6f6f'}}>Valor do documento</span><b class="mono" style=${{fontSize:24}}>${brl(r.total)}</b></div>
   <div style=${{background:'#fff3c4',border:'1px solid #f1c21b',padding:8,fontSize:12,marginTop:8}}>Split payment: na liquidação, ${brl(r.split)} (CBS ${brl(r.cbs)} + IBS ${brl(r.ibs)}) vão direto ao fisco e ${brl(r.liq)} entram na conta da indústria.</div>
  </div>
  <div class="card"><h2 class="ct">Do valor cobrado ao preço da operação</h2><table><tbody>
   <tr><td>Itens a preço de tabela</td><td class="r mono">${brl(r.tabT)}</td></tr>
   <tr><td>(−) Desconto por quantidade</td><td class="r mono">− ${brl(r.dQ)}</td></tr>
   <tr><td>(−) Ajuste manual de preço</td><td class="r mono">− ${brl(r.dN)}</td></tr>
   <tr><td>(−) Desconto na nota</td><td class="r mono">− ${brl(desc)}</td></tr>
   <tr class="hl"><td>Total do boleto (impostos incluídos)</td><td class="r mono">${brl(r.total)}</td></tr>
   <tr><td>(−) ICMS ${pc(rt.icms)} <span class="sub">por dentro</span></td><td class="r mono neg">− ${brl(r.icms)}</td></tr>
   <tr><td>(−) CBS ${pc(rt.cbs)} <span class="sub">dedução</span></td><td class="r mono neg">− ${brl(r.cbs)}</td></tr>
   <tr><td>(−) IBS ${pc(rt.ibs)} <span class="sub">dedução</span></td><td class="r mono neg">− ${brl(r.ibs)}</td></tr>
   ${r.is>0&&html`<tr><td>(−) Imposto Seletivo ${pc(rt.is)}</td><td class="r mono neg">− ${brl(r.is)}</td></tr>`}
   <tr class="hl"><td>Preço da operação</td><td class="r mono">${brl(r.base)}</td></tr>
   <tr><td>(−) Custo de produção</td><td class="r mono">− ${brl(r.cpvT)}</td></tr>
   <tr><td>(−) Frete CIF</td><td class="r mono">− ${brl(r.freT)}</td></tr>
   <tr class="tot"><td>Lucro líquido do pedido</td><td class=${'r mono '+(r.lucro>0?'posc':'neg')}>${brl(r.lucro)}</td></tr></tbody></table>
   ${Dl(['Itens a tabela = Σ quantidade × tabela = '+brl(r.tabT),'Desconto por quantidade = Σ quantidade × (tabela − preço da faixa) = '+brl(r.dQ),'Ajuste manual = Σ quantidade × (preço da faixa − preço praticado) = '+brl(r.dN),'Fator f = 1 + ICMS ÷ (1 − ICMS) + CBS + IBS + IS = 1 + '+r.ia.toFixed(4)+' + '+r.c.toFixed(4)+' + '+r.i.toFixed(4)+' + '+r.s.toFixed(4)+' = '+fS,'Preço da operação = total ÷ f = '+brl(r.total)+' ÷ '+fS+' = '+brl(r.base),'ICMS (por dentro) = operação ÷ (1 − '+rt.icms+'%) × '+rt.icms+'% = '+brl(r.icms),'CBS = operação × '+rt.cbs+'% = '+brl(r.cbs),'IBS = operação × '+rt.ibs+'% = '+brl(r.ibs),'Custo = Σ quantidade × CPV = '+brl(r.cpvT)+' · Frete = Σ quantidade × frete por caixa = '+brl(r.freT),'Split = CBS + IBS (+ IS) = '+brl(r.cbs)+' + '+brl(r.ibs)+' + '+brl(r.is)+' = '+brl(r.split),'Depositado na indústria = total − split = '+brl(r.total)+' − '+brl(r.split)+' = '+brl(r.liq)])}
  </div>
  <div class="card"><h2 class="ct">Resumo para enviar ao cliente</h2>
   <textarea readOnly rows="7" value=${txt} class="mono" style=${{width:'100%',background:'var(--bg)',color:'var(--ink)',border:'1px solid var(--line)',padding:8,fontSize:12}}></textarea>
   <div style=${{display:'flex',gap:8,alignItems:'center',marginTop:8,flexWrap:'wrap'}}><button class="btn" onClick=${copy}>Copiar resumo</button><span class="sub">${msg}</span></div></div></div>`;

 const Cliente=html`<div class="card"><h2 class="ct">Argumento de venda: custo real do cliente</h2>
  <div style=${{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>${CLI.map(([n,c])=>html`<button key=${n} class=${'chip '+(cli===n?'on':'')} onClick=${()=>{setCli(n);setCred(c)}}>${n}</button>`)}</div>
  <div class="row"><label class="lbl">Crédito aproveitado pelo cliente</label><b class="mono">${cred}%</b></div>
  <input type="range" min="0" max="100" step="5" value=${cred} onInput=${e=>setCred(+e.target.value)} aria-label="Crédito aproveitado"/>
  <div class="row" style=${{marginTop:10}}><label class="lbl">Markup de revenda do cliente</label><b class="mono">${mk}%</b></div>
  <input type="range" min="0" max="150" step="1" value=${mk} onInput=${e=>setMk(+e.target.value)} aria-label="Markup do cliente"/>
  <table style=${{marginTop:10}}><tbody>
   <tr><td>Valor do boleto</td><td class="r mono">${brl(r.total)}</td></tr>
   <tr><td>(−) Créditos de ICMS, CBS e IBS</td><td class="r mono posc">− ${brl(r.cr)}</td></tr>
   <tr class="tot"><td>Custo efetivo de entrada</td><td class="r mono">${brl(r.custo)}</td></tr>
   <tr><td>Preço de revenda sugerido (sem imposto de saída)</td><td class="r mono">${brl(revenda)}</td></tr></tbody></table>
  ${Dl(['Crédito = (ICMS + CBS + IBS) × % aproveitado = ('+brl(r.icms)+' + '+brl(r.cbs)+' + '+brl(r.ibs)+') × '+cred+'% = '+brl(r.cr),'Custo efetivo = total − crédito = '+brl(r.total)+' − '+brl(r.cr)+' = '+brl(r.custo),'Revenda = custo efetivo × (1 + markup) = '+brl(r.custo)+' × (1 + '+mk+'%) = '+brl(revenda)])}
  <p style=${{background:'var(--bg)',borderLeft:'4px solid var(--pos)',padding:'10px 12px',fontSize:14,marginTop:12}}>Script: "O pedido fecha em <b>${brl(r.total)}</b>, já com impostos e frete. Como empresa, você recupera <b>${brl(r.cr)}</b> em créditos e o custo real fica em <b>${brl(r.custo)}</b>."</p>
  <p class="sub">Aproveitamento de crédito depende do regime do cliente. Confirme antes de usar o argumento.</p></div>`;

 const Header=html`<div style=${{background:'#161616',color:'#f4f4f4',borderBottom:'2px solid #0f62fe',padding:'8px 14px'}} class="row">
  <span class="mono" style=${{fontSize:12}}><b style=${{background:'#0f62fe',padding:'2px 6px'}}>VENDA</b> Pedido B2B 2027</span>
  <span style=${{display:'flex',gap:8,alignItems:'center',fontSize:12}}><label style=${{display:'flex',gap:4,alignItems:'center',cursor:'pointer'}}><input type="checkbox" checked=${det} onChange=${e=>setDet(e.target.checked)}/> Detalhar cálculos</label>${w>=900&&html`<button class="btn2" style=${{minHeight:28,padding:'2px 8px'}} onClick=${()=>setForce(!force)}>${force?'Voltar ao desktop':'Ver como celular'}</button>`}<button class="btn2" style=${{minHeight:28,padding:'2px 8px'}} onClick=${flip}>Tema</button></span></div>`;

 return html`<div class="app" style=${{maxWidth:force?430:1280,boxShadow:force?'0 0 0 1px var(--line)':'none'}}>
  ${Header}
  <div style=${{background:'#0f62fe',color:'#fff',padding:'8px 12px',display:'flex',flexWrap:'wrap',gap:'4px 12px',alignItems:'center',justifyContent:'center',fontSize:12,textAlign:'center'}}><span style=${{background:'#fff',color:'#0f62fe',padding:'2px 10px',fontWeight:700,letterSpacing:'.06em'}}>MARCELO CLEITON</span><span>Projeto criado para analisar o impacto da Reforma Tributária nas aplicações da SN SISTEMA</span></div>
  <div style=${{padding:mobile?'12px 12px 96px':'20px'}}>
   <h1 style=${{fontSize:mobile?22:28,fontWeight:600,margin:'0 0 4px'}}>Simulador de venda</h1>
   <p class="sub" style=${{marginTop:0,marginBottom:12}}>O cliente ouve um único valor, com impostos e frete. O desconto por quantidade ajusta o preço de cada produto e o simulador separa os tributos por trás para conferir sua margem.</p>
   ${mobile&&html`<div class="seg" role="tablist" style=${{marginBottom:12}}>${[['ped','Pedido'],['fec','Fechamento'],['cli','Cliente']].map(([k,t])=>html`<button key=${k} role="tab" class=${tab===k?'on':''} onClick=${()=>{setTab(k);scrollTo(0,0)}}>${t}</button>`)}</div>`}
   ${mobile
    ?html`<div>${tab==='ped'&&Pedido}${tab==='fec'&&Fechamento}${tab==='cli'&&Cliente}</div>`
    :html`<div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}><div>${Pedido}${Cliente}</div><div>${Fechamento}</div></div>`}
   <footer class="sub" style=${{borderTop:'1px solid var(--line)',marginTop:20,padding:'16px 0',textAlign:'center'}}><b style=${{color:'var(--ink)',letterSpacing:'.04em'}}>MARCELO CLEITON</b> · Criador do projeto<br/>Análise do impacto da Reforma Tributária (LC 214/2025) nas aplicações da SN SISTEMA<br/>© 2026 Marcelo Cleiton. Mantenha o crédito do autor ao compartilhar.</footer>
  </div>
  ${mobile&&html`<div class="dock" style=${{maxWidth:force?430:'none',margin:'0 auto'}}>
   <div><div style=${{fontSize:11,opacity:.7}}>Boleto · ${r.un} cx</div><div class="mono" style=${{fontSize:20,fontWeight:600}}>${brl(r.total)}</div></div>
   <div style=${{textAlign:'right'}}><div style=${{fontSize:11,color:stc,filter:'brightness(1.3)'}}>${st[1]}</div>
   <button class="btn" onClick=${()=>{setTab(tab==='fec'?'ped':'fec');scrollTo(0,0)}}>${tab==='fec'?'Voltar ao pedido':'Fechar pedido'}</button></div></div>`}
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
